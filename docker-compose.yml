version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaiaexport-app
    container_name: gaiaexport-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "9000:9000" # Exposed to allow manual proxy to connect via fastcgi from host Nginx
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - gaia-network
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=gaiaexport
      - DB_USERNAME=gaiauser
      - DB_PASSWORD=gaiapass
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker:
    image: gaiaexport-app
    container_name: gaiaexport-worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - gaia-network
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=gaiaexport
      - DB_USERNAME=gaiauser
      - DB_PASSWORD=gaiapass
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  scheduler:
    image: gaiaexport-app
    container_name: gaiaexport-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - gaia-network
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=gaiaexport
      - DB_USERNAME=gaiauser
      - DB_PASSWORD=gaiapass
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  db:
    image: postgres:15-alpine
    container_name: gaiaexport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiaexport
      POSTGRES_USER: gaiauser
      POSTGRES_PASSWORD: gaiapass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - gaia-network

  redis:
    image: redis:alpine
    container_name: gaiaexport-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gaia-network

networks:
  gaia-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
